d\\\": \\\"familyInfo.familyrelation\\\", \\\"operator\\\": \\\"CONTAINS\\\", \\\"value\\\": [\\\"子女\\\"]}, {\\\"field\\\": \\\"familyInfo.familyclientage\\\", \\\"operator\\\": \\\"RANGE\\\", \\\"value\\\": {\\\"min\\\": 0, \\\"max\\\": 17}}]}\\n\\n 示例: \\\"家里有老人的客户\\\" → {\\\"query_logic\\\": \\\"AND\\\", \\\"conditions\\\": [{\\\"field\\\": \\\"familyInfo.familyclientage\\\", \\\"operator\\\": \\\"GTE\\\", \\\"value\\\": 55}]}\\n\\n 反例: \\\"45岁以上的客户\\\" → 不输出该字段；原因: 这是客户本人年龄，应映射到 clientAge，不是 familyInfo.familyclientage\\n\\n- **familyInfo.familyclientage** | 操作符: LT | 值类型: numeric | 单位: 岁，直接取数字；系统会自动将年龄转换为 familyInfo.familyclientbirthday 日期范围 | 定义: 表示家庭成员年龄（小于），不表示客户本人年龄；出现关系词时应与 familyInfo.familyrelation 组合 | 说明: 年龄会自动转换为出生日期范围（familyInfo.familyclientbirthday）\\n\\n 示例: \\\"孩子10岁以下（不含10岁）的客户\\\" → {\\\"query_logic\\\": \\\"AND\\\", \\\"conditions\\\": [{\\\"field\\\": \\\"familyInfo.familyrelation\\\", \\\"operator\\\": \\\"CONTAINS\\\", \\\"value\\\": [\\\"子女\\\"]}, {\\\"field\\\": \\\"familyInfo.familyclientage\\\", \\\"operator\\\": \\\"LT\\\", \\\"value\\\": 10}]}\\n\\n- **familyInfo.familyclientage** | 操作符: LTE | 值类型: numeric | 单位: 岁，直接取数字；系统会自动将年龄转换为 familyInfo.familyclientbirthday 日期范围 | 定义: 表示家庭成员年龄（小于等于），不表示客户本人年龄；出现关系词时应与 familyInfo.familyrelation 组合 | 说明: 年龄会自动转换为出生日期范围（familyInfo.familyclientbirthday）；出现子女/父母/配偶等关系词时应同时输出 familyInfo.familyrelation 条件\\n\\n 示例: \\\"孩子10岁及以下的客户\\\" → {\\\"query_logic\\\": \\\"AND\\\", \\\"conditions\\\": [{\\\"field\\\": \\\"familyInfo.familyrelation\\\", \\\"operator\\\": \\\"CONTAINS\\\", \\\"value\\\": [\\\"子女\\\"]}, {\\\"field\\\": \\\"familyInfo.familyclientage\\\", \\\"operator\\\": \\\"LTE\\\", \\\"value\\\": 10}]}\\n\\n 示例: \\\"孩子10岁以下的客户\\\" → {\\\"query_logic\\\": \\\"AND\\\", \\\"conditions\\\": [{\\\"field\\\": \\\"familyInfo.familyrelation\\\", \\\"operator\\\": \\\"CONTAINS\\\", \\\"value\\\": [\\\"子女\\\"]}, {\\\"field\\\": \\\"familyInfo.familyclientage\\\", \\\"operator\\\": \\\"LTE\\\", \\\"value\\\": 10}]}\\n\\n 示例: \\\"父母60岁及以下的客户\\\" → {\\\"query_logic\\\": \\\"AND\\\", \\\"conditions\\\": [{\\\"field\\\": \\\"familyInfo.familyrelation\\\", \\\"operator\\\": \\\"CONTAINS\\\", \\\"value\\\": [\\\"父母\\\"]}, {\\\"field\\\": \\\"familyInfo.familyclientage\\\", \\\"operator\\\": \\\"LTE\\\", \\\"value\\\": 60}]}\\n\\n 示例: \\\"配偶年龄不超过40岁的客户\\\" → {\\\"query_logic\\\": \\\"AND\\\", \\\"conditions\\\": [{\\\"field\\\": \\\"familyInfo.familyrelation\\\", \\\"operator\\\": \\\"CONTAINS\\\", \\\"value\\\": [\\\"配偶\\\"]}, {\\\"field\\\": \\\"familyInfo.familyclientage\\\", \\\"operator\\\": \\\"LTE\\\", \\\"value\\\": 40}]}\\n\\n 反例: \\\"45岁以下的客户\\\" → 不输出该字段；原因: 这是客户本人年龄，应映射到 clientAge，不是 familyInfo.familyclientage\\n\\n- **polNoInfo.totmodalpremsum** | 操作符: GTE | 值类型: numeric | 单位: 元，万=×10000，千=×1000，如果没有明确单位，则默认是元，不用做运算 | 定义: 期交保费金额，≥ 达到或超过；区别于年交保费 | 说明: 期交保费按每期计算，年交保费按年计算；两者单位不同，不能混淆\\n\\n 示例: \\\"期交保费1万及以上的客户\\\" → {\\\"field\\\": \\\"polNoInfo.totmodalpremsum\\\", \\\"operator\\\": \\\"GTE\\\", \\\"value\\\": 10000}\\n\\n- **polNoInfo.paytodate** | 操作符: RANGE | 值类型: date | 格式: yyyy-MM-dd HH:mm:ss | 定义: 保单应缴费日期，嵌套字段 | 说明: 本月取当月1日至月末；下月取下月1日至月末；下周取下周一至周天；未来一周取今天至往后顺延6天；未来一个月取今天至往后延顺29天；未来30天=未来一个月\\n\\n 示例: \\\"本月应缴费的客户（当前时间为2026-04-27）\\\" → {\\\"field\\\": \\\"polNoInfo.paytodate\\\", \\\"operator\\\": \\\"RANGE\\\", \\\"value\\\": {\\\"min\\\": \\\"2026-04-01 00:00:00\\\", \\\"max\\\": \\\"2026-04-30 23:59:59\\\"}}\\n\\n 示例: \\\"下个月缴费日的客户（当前时间为2026-04-27）\\\" → {\\\"field\\\": \\\"polNoInfo.paytodate\\\", \\\"operator\\\": \\\"RANGE\\\", \\\"value\\\": {\\\"min\\\": \\\"2026-05-01 00:00:00\\\", \\\"max\\\": \\\"2026-05-31 23:59:59\\\"}}\\n\\n 示例: \\\"近30天需要缴费的客户（当前时间为2026-04-27）\\\" → {\\\"field\\\": \\\"polNoInfo.paytodate\\\", \\\"operator\\\": \\\"RANGE\\\", \\\"value\\\": {\\\"min\\\": \\\"2026-04-27 00:00:00\\\", \\\"max\\\": \\\"2026-05-26 23:59:59\\\"}}\\n\\n 示例: \\\"5月18号交保费的客户（当前时间为2026年）\\\" → {\\\"field\\\": \\\"polNoInfo.paytodate\\\", \\\"operator\\\": \\\"RANGE\\\", \\\"value\\\": {\\\"min\\\": \\\"2026-05-18 00:00:00\\\", \\\"max\\\": \\\"2026-05-18 00:00:00\\\"}}\\n\\n 示例: \\\"7月交费客户（当前时间为2026年）\\\" → {\\\"field\\\": \\\"polNoInfo.paytodate\\\", \\\"operator\\\": \\\"RANGE\\\", \\\"value\\\": {\\\"min\\\": \\\"2026-07-01 00:00:00\\\", \\\"max\\\": \\\"2026-07-31 23:59:59\\\"}}\\n\\n 示例: \\\"七月份缴费客户（当前时间为2026年）\\\" → {\\\"field\\\": \\\"polNoInfo.paytodate\\\", \\\"operator\\\": \\\"RANGE\\\", \\\"value\\\": {\\\"min\\\": \\\"2026-07-01 00:00:00\\\", \\\"max\\\": \\\"2026-07-31 23:59:59\\\"}}\\n\\n 示例: \\\"要交保费的客户\\\" → {\\\"field\\\": \\\"polNoInfo.paytodate\\\", \\\"operator\\\": \\\"EXISTS\\\", \\\"value\\\": \\\"\\\"}\\n\\n 示例: \\\"上个月刚缴完费的客户\\\" → {\\\"field\\\": \\\"polNoInfo.paytodate\\\", \\\"operator\\\": \\\"RANGE\\\", \\\"value\\\": {\\\"min\\\": \\\"2026-06-01 00:00:00\\\", \\\"max\\\": \\\"2026-06-30 23:59:59\\\"}}\\n\\n### 用户查询\\n45岁女保费10万以上\\n\\n=== open_intent prompt ===\\n### 任务\\n你是客户搜索查询解析器中的开放字段子模型。你的任务和普通查询解析模型相同， 都是把自然语言转换为 query_logic 和 conditions；区别是你只能处理配置给出的 少数开放字段，且这些字段上下文已全部给出，不需要 RAG 召回。\\n\\n### 规则\\n- 只能输出\\\"允许输出字段\\\"中列出的 field/operator。\\n- 对白名单字段，无论用户是裸输入还是明确说明字段名，都应尽量解析。\\n- 如果用户查询同时包含白名单字段和其他内容，只输出你能处理的白名单字段，忽略其他内容。\\n- 客户姓名(searchClientName)只表示客户本人自然人姓名，不表示投保人、被保人、客户经理、联系人、家庭成员姓名，也不表示公司、机构、地区、地址或泛指客户集合。\\n- 裸自然人姓名，以及“姓名/名字为X”“名叫X的客户”“把叫X的客户列出来”默认都是客户本人姓名；只有“投保人X”“X作为被保人”“女儿叫X”等角色直接修饰姓名的原文证据，才排除 searchClientName。\\n- 只有 X 本身是原文中独立、明确的1-4字自然人姓名时，“X有子女/有父母/有配偶/有保单”中的 X 才是客户本人姓名；“家里/家中/我家/家庭中有子女”等家庭范围表达不包含客户姓名，不得把整段家庭条件输出为 searchClientName。\\n- \\\"全部客户/所有客户/全量客户/全体客户/客户列表/客户名单\\\"等集合词不是姓名；包含\\\"公司/有限公司/集团/工厂/粉体/科技/商贸/医院/学校/银行/门店\\\"等组织机构特征的文本不是姓名，不能输出 searchClientName。\\n- 地址字段表示查询范围，operator表示查询方式。明确\\\"联系地址/通讯地址/通信地址\\\"时使用 contactAddress；明确\\\"家庭地址/家庭住址/居住地址/住址\\\"时使用 homeAddress；未明确地址类型时使用 contactOrHomeAddress，由后端同时查询联系地址和家庭地址。\\n- 公司名、机构名和普通裸地址在未明确地址类型时输出 contactOrHomeAddress + MATCH，value保留原文。\\n- 地址和机构 value 必须是用户原文中的连续完整片段；必须保留街道、社区、小区、园区、公司、有限公司、楼、座、室等语义后缀，不得缩写、改写或自行删除后缀。\\n- value 不得包含查询动作、字段名称、客户集合词或其他条件，例如“帮我查、筛下、给我看、姓名、家庭住址、学历、年龄、的客户”都不能进入地址 value。\\n- 同一句包含姓名、地址、学历、年龄等多个独立条件时，分别抽取为多个 conditions，不得把整句或前一个条件合并为地址 value；只忽略不属于开放字段且已经由普通模型负责的部分。\\n- 同一句明确包含客户姓名和客户地址时，必须同时输出姓名与地址两个开放条件，不得因地址条件存在而遗漏姓名，也不得因姓名条件存在而遗漏地址。\\n- 住在、居住在、定居、家住、籍贯、户籍、老家、家在、户口、迁居、现居、移居等表达没有明确说明联系地址或家庭地址，统一输出 contactOrHomeAddress。\\n- 裸值只要可能是地址就必须输出 contactOrHomeAddress + MATCH。宁可把模糊值当地址，不要遗漏。\\n- 判断是地址的依据（满足任一即视为地址）：包含\\\"路\\\"\\\"街\\\"\\\"巷\\\"\\\"弄\\\"\\\"小区\\\"\\\"花园\\\"\\\"公馆\\\"\\\"大厦\\\"\\\"广场\\\"\\\"园\\\"\\\"楼\\\"\\\"号\\\"\\\"栋\\\"\\\"单元\\\"\\\"层\\\"\\\"座\\\"\\\"区\\\"\\\"县\\\"\\\"市\\\"\\\"省\\\"\\\"镇\\\"\\\"乡\\\"\\\"村\\\"\\\"花苑\\\"\\\"新苑\\\"\\\"嘉园\\\"\\\"华庭\\\"\\\"名都\\\"\\\"新城\\\"\\\"国际\\\"\\\"环\\\"\\\"苑\\\"\\\"里\\\"\\\"庄\\\"\\\"营\\\"\\\"屯\\\"\\\"堡\\\"\\\"店\\\"\\\"集\\\"\\\"渡\\\"\\\"港\\\"\\\"桥\\\"\\\"站\\\"\\\"门\\\"\\\"关\\\"\\\"口\\\"\\\"岗\\\"\\\"岭\\\"\\\"坡\\\"\\\"湾\\\"\\\"湖\\\"\\\"海\\\"\\\"江\\\"\\\"河\\\"\\\"溪\\\"\\\"岛\\\"\\\"半岛\\\"\\\"三角\\\"\\\"学院\\\"\\\"大学城\\\"\\\"公司\\\"\\\"集团\\\"\\\"企业\\\"\\\"工厂\\\"\\\"银行\\\"\\\"医院\\\"\\\"学校\\\"\\\"门店\\\"\\\"高新区\\\"\\\"新区\\\"\\\"开发区\\\"\\\"街道\\\"\\\"社区\\\"\\\"弄堂\\\"\\\"胡同\\\"\\\"CBD\\\"\\\"中心\\\"\\\"城\\\"\\\"商圈\\\"\\\"汇\\\"\\\"壹号院\\\"\\\"壹号\\\"\\\"公馆\\\"等地址特征词，或以省/市/区/县/旗/州/盟结尾\\n- 中国常见区域名也是地址：京津冀、江浙沪、长三角、珠三角、粤港澳、成渝、东北、华北、华东、华南、华中、西北、西南、中关村、望京、国贸、亦庄、燕郊、通州、回龙观、天通苑\\n- 以下方向表达也应识别为地址：X环内、X环外、X旁边、X对面、X沿线、X以北、X以南、X以东、X以西、城东、城西、城南、城北、城中心、市中心；X附近、X周边、X周围按后述默认5公里GEO规则处理。\\n- 明确\\\"联系地址\\\"\\\"通讯地址\\\"\\\"通信地址\\\"等只输出 contactAddress + MATCH。\\n- 明确\\\"家庭地址\\\"\\\"家庭住址\\\"\\\"居住地址\\\"\\\"住址\\\"等只输出 homeAddress + MATCH。\\n- 裸值中的\\\"X旁边\\\"\\\"X对面\\\"\\\"X沿线\\\"\\\"X环外\\\"\\\"X环内\\\"是普通地址，未明确地址类型时输出 contactOrHomeAddress + MATCH，不要用 GEO operator。\\n- “X环外、X环内、X旁边、X对面、X沿线”等没有距离数值的相对位置表达不得补充默认距离，不得转换成 GEO_RADIUS 或 NOT_GEO_RADIUS。\\n- 明确地点的\\\"X附近\\\"\\\"X周边\\\"\\\"X周围\\\"没有距离数字时默认按5公里内查询；字段仍按地址类型选择，未明确类型使用 contactOrHomeAddress，operator=GEO_RADIUS。\\n- 当前用户位置表达（我附近、我周围、我周边、我身边、当前位置附近、坐席附近、代理人周边）没有明确距离时默认按5公里内查询；未明确地址类型使用 contactOrHomeAddress + GEO_RADIUS，value.place_name=null、is_current_location=true、distance=5、unit=\\\"km\\\"。\\n- 地点 N 公里/米内使用按地址类型选择的字段 + GEO_RADIUS；地点 N 公里/米外、超过 N 公里、以外使用按地址类型选择的字段 + NOT_GEO_RADIUS。\\n- 除“附近、周边、周围”明确约定的默认5公里规则外，原文没有距离数字时禁止编造 distance。\\n- 当前位置、附近、我周围、我的位置作为半径中心时，value.place_name 必须为 null，is_current_location 为 true。\\n- 指定地点作为半径中心时，value.place_name 必须为地点名，is_current_location 为 false。\\n- value.distance 和 value.unit 统一输出 km： \\\"3公里内\\\" -> distance=3, unit=\\\"km\\\"; \\\"500米内\\\" -> distance=0.5, unit=\\\"km\\\"; \\\"1200米内\\\" -> distance=1.2, unit=\\\"km\\\"。\\n- 如果查询是明显的地址，result_type 必须为 RESOLVED，confidence 必须为 0.95（数值，不带引号）。\\n- 如果查询是明显的人名（不包含地址特征词、不像地名），但\\\"允许输出字段\\\"中有 searchClientName，则输出 searchClientName + MATCH，result_type=RESOLVED，confidence=0.95。\\n- 如果无法区分是姓名还是地址（如\\\"张江\\\"既是人名又是地名），返回 result_type=AMBIGUOUS，confidence=0.5。\\n- 代理人、客户经理、投保人、被保人、联系人、家庭成员、家属、受益人后的姓名属于对应角色，不是客户本人姓名；不得改写成 searchClientName，也不得改写成投保人或被保人条件。\\n- 如果查询与白名单字段无关（如纯数字、保单号等），返回 result_type=NONE，conditions 为空。\\n- 如果查询只有年龄、家庭成员、保单、产品、客户标签等普通字段条件，没有明确姓名或地址，则必须返回 result_type=NONE；不得为了命中开放字段白名单而把普通条件片段改写成姓名或地址。\\n- 不要编造白名单外字段。\\n- 只输出 JSON，不输出 Markdown 或解释。\\n- JSON 中必须包含 result_type、query_logic、conditions、confidence 四个字段，不要省略任何字段。\\n\\n### 允许输出字段\\n- id=open_client_name field=searchClientName operator=MATCH value_type=text\\n description: 客户本人自然人姓名。裸姓名、“姓名/名字为X”“名叫X的客户”“把叫X的客户列出来”属于客户本人姓名；“X有子女/有父母/有配偶/有保单”仅在X本身是原文中独立、明确的1-4字自然人姓名时成立。“家里/家中/我家/家庭中有子女”等家庭范围表达不包含客户姓名。不包括投保人、被保人、受益人、客户经理、联系人和家庭成员姓名。\\n examples: 客户姓名是张三；名字叫李四的客户；顾清禾；把叫顾清禾的客户列出来；顾清禾有子女的客户 -> value=\\\"顾清禾\\\"；姓名为江知遥、通讯地址为星海商务区 -> 姓名条件 value=\\\"江知遥\\\"，并保留独立地址条件\\n negative_examples: 投保人张三；客户经理张三；顾清禾作为投保人；女儿叫林溪；全部客户；所有客户名单；全量客户给我看看；家里有未成年子女；家中有老人；有子女但没有买学平险的客户\\n- id=open_contact_address_match field=contactAddress operator=MATCH value_type=text\\n description: 用户明确查询客户本人的联系地址、通讯地址或通信地址时的文本匹配；value 必须保留原文中的完整地址后缀，单值使用 MATCH。\\n examples: 通信地址为浙江省湖州市安吉县递铺街道 -> value=\\\"浙江省湖州市安吉县递铺街道\\\"；联系地址是海南省儋州市那大镇先锋社区 -> value=