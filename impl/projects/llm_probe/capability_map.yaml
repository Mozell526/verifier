# capability 预设注册表：每个条目自包含（能力口径 + 探测端点 + mock 模板），
# 与 verifier 项目注册表零绑定；键名只是预设名，不解析为项目。
client_search:
  capability: |
    接收自然语言的客户群体描述，输出可执行的结构化搜索条件（字段 × 操作符 × 值）。
    不支持的表述应明确拒绝或给出能力边界，而不是编造条件。
  service:
    url: http://127.0.0.1:8000/api/v1/client_search_query_parse_no_encipher
    method: POST
    timeout_seconds: 60
  mock_body:
    user_text: '{query}'
    user_id: mock_user_001
    trace_id: mock_trace_dyn
    session_id: mock_session_dyn
    source: mock
    extra_input_params: {}

policy_search:
  capability: |
    把自然语言保单筛选意图转成可执行的查询语法树。
    只负责解析与过滤条件，不负责下游保单列表检索。
  service:
    url: http://127.0.0.1:8050/api/v1/policy-search/policy-search-parse
    method: POST
    timeout_seconds: 120
  mock_body:
    session_id: mock_session_dyn
    trace_id: mock_trace_dyn
    user_id: verifier-user
    org_id: verifier-org
    org_name: verifier
    ts: 1785983400000
    token: ''
    app_scenario: policy_search_parse
    source: verifier
    user_text: ''
    history: []
    user_action: write
    action_scenario: policySearch
    extra_input_params:
      policySearchParseArgs:
        query: '{query}'
        currentTime: '2026-08-06 10:30:00'
        agentCode: A12345678
      agent_args: null
      args:
        contexts: []
    application_setting: null
    scenario: null

marketting-planning-intent:
  capability: |
    对单轮营销规划问句做意图识别，给出意图标签和必要槽位。
    不进入多轮规划、不生成 SSE 卡片。
  service:
    url: http://127.0.0.1:9006/api/v1/marketing-planning/intent-recognition
    method: POST
    timeout_seconds: 60
  mock_body:
    session_id: mock_session_dyn
    trace_id: mock_trace_dyn
    org_id: default_org
    user_text: '{query}'
    extra_input_params:
      agent_args:
        conversation_id: mock_session_dyn
        message:
          content: '{query}'
          content_type: text
      args:
        extensions: {}
        contexts: []
