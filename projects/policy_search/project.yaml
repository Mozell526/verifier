schema_version: 1

project:
  id: policy_search
  name: 保单搜索解析
  description: 评估 Policy Search 将自然语言保单筛选意图转换为可执行查询语法树的正确性、完整性与安全失败能力

documents:
  startup:
    path: route://start.md
    type: startup
    required: true
    description: Policy Search 本地启动、健康检查和故障排查
  api:
    path: route://live.md
    type: api
    required: true
    description: Policy Search 单轮解析接口及请求响应合同
  requirements:
    path: route://requirements.md
    type: requirements
    required: true
    description: 保单搜索解析的业务目标、范围和核心场景
  judge_boundary:
    path: route://judge_boundary.md
    type: judge_boundary
    required: true
    description: Policy Search 可评价边界与外部依赖责任
  reference:
    path: route://reference.md
    type: reference
    required: true
    description: 业务源码、配置、协议和 golden dataset 资料入口

source:
  repository: ${POLICY_SEARCH_REPO}

onboarding:
  interaction: single_turn
  ready: []

environment:
  variables:
    POLICY_SEARCH_REPO:
      bind: source.repository
      type: path
      required: true
      secret: false
      description: policy-search 业务源码位置，供接入分析、本地启动和证据读取使用
