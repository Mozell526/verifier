schema_version: 2
baseline: "20260721"
purpose: path-semantic migration evidence; not a configuration source

probes:
  public-command-config: tests/test_config_contract.py::test_resolver_applies_registered_precedence_and_tracks_sources
  five-root-isolation: tests/test_path_contract.py::test_all_five_roots_move_without_changing_logical_references
  project-source-config: tests/test_config_path_portability.py::test_project_moves_between_machine_roots_without_yaml_change
  five-project-machine-portability: tests/test_config_path_portability.py::test_all_real_projects_resolve_equivalently_across_two_machine_layouts
  route-resolution: tests/test_project_config_contract.py::test_knowledge_route_resolves_registered_repository_and_tracks_source
  project-dispatch: tests/test_project_layer_dispatch.py::test_project_loader_returns_optional_project_modules
  local-service-start: tests/test_project_config_contract.py::test_local_service_reuses_health_and_starts_only_when_needed
  investigation-portable: tests/test_investigation_portable_paths.py::test_v2_manifest_round_trips_and_resolves_logical_paths
  draft-resume: tests/test_draft_loop.py::test_draft_loop_freezes_current_and_requires_review_between_iterations
  endpoint-scope: tests/test_endpoint_discovery.py::test_endpoint_discovery_hides_framework_request_param
  active-registry: tests/test_active_artifacts.py::test_registered_writer_requires_known_family_and_owned_target
  non-file-types: tests/test_config_path_portability.py::test_project_moves_between_machine_roots_without_yaml_change

entries:
  - entry_id: public-python-executable
    project: public
    historical_location: impl/config.yaml.python.executable
    semantic_scope: non_file
    lifecycle: config_input
    canonical_target:
      kind: yaml_field
      value: impl/config.yaml#python.executable
    consumers: [impl.core.config, run.sh, config-check]
    probe_id: public-command-config
    disposition: handoff
    compatibility: {status: none}

  - entry_id: public-context-records
    project: public
    historical_location: impl/data/context_store physical record paths
    semantic_scope: verifier_repo
    lifecycle: derived_active
    canonical_target:
      kind: logical_path_ref
      location_scope: verifier_repo
      field: context record persisted path references
    consumers: [context replay, context API]
    probe_id: active-registry
    disposition: migrate
    compatibility: {status: removed}

  - entry_id: public-case-pool
    project: public
    historical_location: impl/data/case_pools.json resumable case references
    semantic_scope: verifier_repo
